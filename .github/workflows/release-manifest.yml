name: Update platform download links
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published platform tag, e.g. android-v3.7.0 or desktop-v3.8.8'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: platform-release-manifest
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read and validate completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(android|desktop)-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Release creation and asset uploads are separate GitHub API calls.
          # Fail rather than advertise a partly uploaded release.
          for attempt in 1 2 3 4 5 6; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp --jq 'add' > "$RUNNER_TEMP/releases.json"
            if python3 scripts/update_manifest.py "$RUNNER_TEMP/releases.json"; then break; fi
            if [[ "$attempt" == 6 ]]; then exit 1; fi
            sleep 10
          done
      - name: Commit platform-specific links
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update download links for $RELEASE_TAG"
          git pull --rebase origin main
          git push origin HEAD:main
