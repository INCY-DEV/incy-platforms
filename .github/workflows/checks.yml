name: Check release configuration
on:
  push:
    paths: ['scripts/**', 'tests/**', 'obtainium.json', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'obtainium.json', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
